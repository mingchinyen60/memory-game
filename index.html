<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>記憶翻牌益智遊戲</title>
  <style>
    :root {
      --bg-color: #FAF6F0;
      --card-bg: #FFFFFF;
      --card-back: #F3E9DD;
      --primary: #E27D60;
      --primary-hover: #D0694D;
      --secondary: #85CDCA;
      --secondary-hover: #6EBAB6;
      --accent: #E8A87C;
      --success: #68B0AB;
      --text-main: #4A403A;
      --text-muted: #8D7B68;
      --shadow-sm: 0 4px 10px rgba(74, 64, 58, 0.08);
      --shadow-md: 0 8px 24px rgba(74, 64, 58, 0.12);
      --shadow-lg: 0 12px 32px rgba(74, 64, 58, 0.16);
      --radius-sm: 14px;
      --radius-md: 18px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 12px 36px;
      touch-action: manipulation;
    }

    /* 遊戲主體容器 */
    .game-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    /* 頂部標題 */
    header {
      text-align: center;
      margin-top: 4px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    p.subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 儀表板：時間、翻牌次數、進度 */
    .dashboard {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: var(--card-bg);
      padding: 14px 12px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 2px solid #F0E4D7;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
    }

    /* 按鈕操作區 (Start, Reset, 遊戲紀錄) */
    .controls {
      width: 100%;
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      outline: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--secondary);
      color: #FFFFFF;
    }

    .btn-secondary:hover {
      background: var(--secondary-hover);
    }

    .btn-history {
      background: #D8B4A6;
      color: #FFFFFF;
    }

    .btn-history:hover {
      background: #C79E8E;
    }

    /* 遊戲提示語 */
    .game-status-hint {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
      min-height: 24px;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 4x4 遊戲網格 (16張) */
    .grid-board {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      perspective: 1000px;
    }

    /* 卡片與 3D 翻轉效果 */
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: var(--radius-sm);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      transform: rotateY(180deg) scale(0.96);
      animation: matchSuccess 0.45s ease;
    }

    @keyframes matchSuccess {
      0% { transform: rotateY(180deg) scale(1); }
      40% { transform: rotateY(180deg) scale(1.1); box-shadow: 0 0 16px rgba(104, 176, 171, 0.6); }
      100% { transform: rotateY(180deg) scale(0.96); }
    }

    .card-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: var(--shadow-sm);
      border: 3px solid #F0E5D8;
    }

    /* 卡片背面 */
    .card-back {
      background: linear-gradient(135deg, #FFF9F2 0%, #F5E8D8 100%);
      color: var(--accent);
      font-size: 2rem;
    }

    .card-back::after {
      content: '❓';
      font-size: 1.8rem;
      opacity: 0.85;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
      transition: transform 0.25s ease;
    }

    .card:hover .card-back::after {
      transform: scale(1.15) rotate(-6deg);
    }

    /* 卡片正面 */
    .card-front {
      background: #FFFFFF;
      transform: rotateY(180deg);
      font-size: 2.5rem;
      border-color: var(--secondary);
    }

    .card.matched .card-front {
      background: #F4FAF9;
      border-color: var(--success);
    }

    /* 彈跳視窗 Modal (勝利 & 歷史紀錄) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(45, 36, 32, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #FFFFFF;
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius-lg);
      padding: 26px 20px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      transform: translateY(20px) scale(0.95);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 3px solid #FAF0E6;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .modal-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
      animation: bounce 1s infinite alternate ease-in-out;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .modal-stats {
      background: #FFFDF9;
      border: 2px dashed #EEDDC9;
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
    }

    .modal-stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .modal-stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .modal-stat-num {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* 紀錄清單 */
    .history-list-wrapper {
      overflow-y: auto;
      flex: 1;
      margin: 12px 0 18px;
      padding-right: 4px;
      max-height: 280px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FDF9F5;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      border: 1px solid #F0E3D5;
    }

    .history-rank {
      font-weight: 800;
      color: var(--accent);
      width: 24px;
      text-align: left;
    }

    .history-details {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      flex: 1;
      margin: 0 10px;
    }

    .history-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .history-score {
      font-weight: 700;
      color: var(--text-main);
    }

    .history-badge {
      font-size: 0.85rem;
      background: #EAF7F6;
      color: var(--success);
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
    }

    .empty-history {
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 彩花 Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1001;
    }

    /* 手機與平板適配 */
    @media (max-width: 420px) {
      h1 { font-size: 1.6rem; }
      .stat-value { font-size: 1.2rem; }
      .btn { font-size: 0.95rem; padding: 10px 6px; }
      .card-front { font-size: 2.1rem; }
      .card-back::after { font-size: 1.5rem; }
      .grid-board { gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- 彩花動畫畫布 -->
  <canvas id="confetti-canvas"></canvas>

  <div class="game-container">
    <header>
      <h1>🎴 記憶翻牌挑戰</h1>
      <p class="subtitle">放鬆心情，找出所有相同的牌組吧！</p>
    </header>

    <!-- 狀態資訊列 (時間、翻牌次數、配對進度) -->
    <div class="dashboard">
      <div class="stat-box">
        <span class="stat-label">⏱️ 遊戲時間</span>
        <span class="stat-value" id="timer-display">00:00</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">🔄 翻牌次數</span>
        <span class="stat-value" id="flips-display">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">✨ 配對進度</span>
        <span class="stat-value" id="pairs-display">0 / 8</span>
      </div>
    </div>

    <!-- 控制按鈕區 (Start, Reset, 遊戲紀錄) -->
    <div class="controls">
      <button class="btn btn-primary" id="btn-start" aria-label="開始遊戲">
        <span>▶️ 開始</span>
      </button>
      <button class="btn btn-secondary" id="btn-reset" aria-label="重新開始">
        <span>🔄 重新開始</span>
      </button>
      <button class="btn btn-history" id="btn-history" aria-label="遊戲紀錄">
        <span>📋 遊戲紀錄</span>
      </button>
    </div>

    <!-- 狀態指引提示 -->
    <div class="game-status-hint" id="status-hint">
      點擊「開始」或任一張牌展開挑戰！
    </div>

    <!-- 4x4 卡片網格 (16張) -->
    <main class="grid-board" id="grid-board" aria-label="卡片遊戲棋盤"></main>
  </div>

  <!-- 過關慶祝 Modal -->
  <div class="modal-overlay" id="win-modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-icon">🏆</div>
      <h2 class="modal-title">恭喜過關！</h2>
      <p class="modal-desc">您的記憶力超棒，成功完成所有配對！</p>
      
      <div class="modal-stats">
        <div class="modal-stat-item">
          <span class="modal-stat-label">總共耗時</span>
          <span class="modal-stat-num" id="win-time">00:00</span>
        </div>
        <div class="modal-stat-item">
          <span class="modal-stat-label">翻牌次數</span>
          <span class="modal-stat-num" id="win-flips">0 次</span>
        </div>
        <div class="modal-stat-item">
          <span class="modal-stat-label">記憶評級</span>
          <span class="modal-stat-num" id="win-rating">⭐⭐⭐</span>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" id="btn-play-again" style="flex: 1;">
          <span>🎉 再玩一次</span>
        </button>
        <button class="btn btn-history" id="btn-view-history" style="flex: 1;">
          <span>📜 查看紀錄</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 遊戲紀錄 Modal -->
  <div class="modal-overlay" id="history-modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2 class="modal-title" style="margin-bottom: 4px;">📋 歷史遊戲紀錄</h2>
      <p class="modal-desc" style="margin-bottom: 8px;">記錄每次的通關精彩時刻</p>
      
      <div class="history-list-wrapper">
        <ul class="history-list" id="history-list"></ul>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-secondary" id="btn-close-history" style="flex: 1;">
          <span>關閉</span>
        </button>
        <button class="btn btn-history" id="btn-clear-history" style="flex: 1; background: #E58C8A;">
          <span>🗑️ 清除紀錄</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    /* 遊戲參數與配置 */
    const ICONS = ['🍎', '🐶', '🌟', '🚀', '🍓', '🍀', '🐱', '🎈'];
    const TOTAL_PAIRS = 8;
    const STORAGE_KEY = 'MEMORY_GAME_RECORDS_V1';

    let flippedCards = [];
    let matchedPairs = 0;
    let flipCount = 0;
    let timerInterval = null;
    let secondsElapsed = 0;
    let isGameRunning = false;
    let isBoardLocked = false;

    // DOM 元素快取
    const gridBoard = document.getElementById('grid-board');
    const timerDisplay = document.getElementById('timer-display');
    const flipsDisplay = document.getElementById('flips-display');
    const pairsDisplay = document.getElementById('pairs-display');
    const statusHint = document.getElementById('status-hint');

    const btnStart = document.getElementById('btn-start');
    const btnReset = document.getElementById('btn-reset');
    const btnHistory = document.getElementById('btn-history');

    const winModal = document.getElementById('win-modal');
    const winTime = document.getElementById('win-time');
    const winFlips = document.getElementById('win-flips');
    const winRating = document.getElementById('win-rating');
    const btnPlayAgain = document.getElementById('btn-play-again');
    const btnViewHistory = document.getElementById('btn-view-history');

    const historyModal = document.getElementById('history-modal');
    const historyList = document.getElementById('history-list');
    const btnCloseHistory = document.getElementById('btn-close-history');
    const btnClearHistory = document.getElementById('btn-clear-history');

    /* 計時器處理 */
    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const seconds = (totalSeconds % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function startTimer() {
      if (timerInterval) return;
      isGameRunning = true;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        timerDisplay.textContent = formatTime(secondsElapsed);
      }, 1000);
      btnStart.innerHTML = '<span>⏸️ 進行中</span>';
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      stopTimer();
      secondsElapsed = 0;
      timerDisplay.textContent = '00:00';
      btnStart.innerHTML = '<span>▶️ 開始</span>';
    }

    /* 盤面建立與 Fisher-Yates 洗牌 */
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function createGameBoard() {
      gridBoard.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      flipCount = 0;
      isBoardLocked = false;
      
      flipsDisplay.textContent = '0';
      pairsDisplay.textContent = `0 / ${TOTAL_PAIRS}`;
      statusHint.textContent = isGameRunning ? '翻開兩張牌找出相同圖案！' : '點擊「開始」或任一張牌展開挑戰！';

      const deckIcons = shuffle([...ICONS, ...ICONS]);

      deckIcons.forEach((icon, index) => {
        const cardElement = document.createElement('div');
        cardElement.classList.add('card');
        cardElement.dataset.index = index;
        cardElement.dataset.icon = icon;
        cardElement.setAttribute('role', 'button');
        cardElement.setAttribute('aria-label', `第 ${index + 1} 張卡片`);

        cardElement.innerHTML = `
          <div class="card-face card-back"></div>
          <div class="card-face card-front">${icon}</div>
        `;

        cardElement.addEventListener('click', () => handleCardClick(cardElement));
        gridBoard.appendChild(cardElement);
      });
    }

    /* 翻牌與比對邏輯 */
    function handleCardClick(card) {
      if (isBoardLocked) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

      if (!isGameRunning) {
        startTimer();
      }

      card.classList.add('flipped');
      flippedCards.push(card);

      if (navigator.vibrate) navigator.vibrate(25);

      if (flippedCards.length === 1) {
        statusHint.textContent = `已翻開 ${card.dataset.icon}，請翻開第 2 張配對！`;
        return;
      }

      if (flippedCards.length === 2) {
        flipCount++;
        flipsDisplay.textContent = flipCount;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.icon === card2.dataset.icon;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        pairsDisplay.textContent = `${matchedPairs} / ${TOTAL_PAIRS}`;
        statusHint.textContent = `🎯 配對成功（${card1.dataset.icon}）！超厲害！`;

        if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
        flippedCards = [];

        if (matchedPairs === TOTAL_PAIRS) {
          handleGameWon();
        }
      } else {
        // 翻錯：鎖定盤面 1 秒後翻回
        isBoardLocked = true;
        statusHint.textContent = '😅 圖案不同，1 秒後翻回背面...';

        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          isBoardLocked = false;
          statusHint.textContent = '記住剛才的圖案，繼續加油！';
        }, 1000);
      }
    }

    /* 通關結算與評級 */
    function calculateRating(flips) {
      if (flips <= 12) return '⭐⭐⭐ (神級記憶)';
      if (flips <= 18) return '⭐⭐ (超強表現)';
      return '⭐ (順利通關)';
    }

    function handleGameWon() {
      stopTimer();
      isGameRunning = false;
      btnStart.innerHTML = '<span>▶️ 開始</span>';

      const timeFormatted = formatTime(secondsElapsed);
      const rating = calculateRating(flipCount);

      winTime.textContent = timeFormatted;
      winFlips.textContent = `${flipCount} 次`;
      winRating.textContent = rating;

      saveGameRecord({
        date: new Date().toLocaleString('zh-TW', {
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        }),
        seconds: secondsElapsed,
        timeFormatted: timeFormatted,
        flips: flipCount,
        rating: rating.split(' ')[0]
      });

      setTimeout(() => {
        winModal.classList.add('active');
        fireConfetti();
      }, 400);
    }

    /* 遊戲歷史紀錄 (LocalStorage) */
    function getRecords() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveGameRecord(record) {
      try {
        const records = getRecords();
        records.unshift(record);
        if (records.length > 20) records.pop();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (e) {
        console.error(e);
      }
    }

    function renderHistory() {
      const records = getRecords();
      historyList.innerHTML = '';

      if (records.length === 0) {
        historyList.innerHTML = '<li class="empty-history">尚無遊戲紀錄，快來通關一局吧！✨</li>';
        return;
      }

      records.forEach((item, index) => {
        const li = document.createElement('li');
        li.classList.add('history-item');
        li.innerHTML = `
          <span class="history-rank">#${index + 1}</span>
          <div class="history-details">
            <span class="history-score">耗時 ${item.timeFormatted} ｜ 翻牌 ${item.flips} 次</span>
            <span class="history-meta">📅 ${item.date}</span>
          </div>
          <span class="history-badge">${item.rating}</span>
        `;
        historyList.appendChild(li);
      });
    }

    /* 按鈕事件監聽 */
    btnStart.addEventListener('click', () => {
      if (!isGameRunning) {
        startTimer();
        statusHint.textContent = '遊戲開始！點擊卡片進行配對吧！';
      }
    });

    btnReset.addEventListener('click', () => {
      resetTimer();
      isGameRunning = false;
      createGameBoard();
      statusHint.textContent = '遊戲已重設，點擊「開始」或卡片開始計時！';
    });

    btnHistory.addEventListener('click', () => {
      renderHistory();
      historyModal.classList.add('active');
    });

    btnCloseHistory.addEventListener('click', () => {
      historyModal.classList.remove('active');
    });

    btnClearHistory.addEventListener('click', () => {
      if (confirm('確定要清除所有遊玩紀錄嗎？')) {
        localStorage.removeItem(STORAGE_KEY);
        renderHistory();
      }
    });

    btnPlayAgain.addEventListener('click', () => {
      winModal.classList.remove('active');
      resetTimer();
      createGameBoard();
      startTimer();
    });

    btnViewHistory.addEventListener('click', () => {
      winModal.classList.remove('active');
      renderHistory();
      historyModal.classList.add('active');
    });

    [winModal, historyModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
      });
    });

    /* 輕量原生彩花動畫 (Canvas Confetti) */
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let animationFrameId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
      resizeCanvas();
      confettiParticles = [];
      const colors = ['#E27D60', '#85CDCA', '#E8A87C', '#C38D9E', '#41B3A3', '#F4D06F', '#FF7597'];
      for (let i = 0; i < 90; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 160,
          y: canvas.height * 0.45,
          size: Math.random() * 8 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 16,
          vy: Math.random() * -14 - 4,
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12,
          gravity: 0.35,
          alpha: 1
        });
      }
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.rot += p.vRot;
        p.alpha -= 0.007;

        if (p.alpha > 0 && p.y < canvas.height + 20) {
          alive = true;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx.restore();
        }
      });

      if (alive) {
        animationFrameId = requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // 初始化盤面
    createGameBoard();
  </script>
</body>
</html>
